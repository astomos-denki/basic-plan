<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="アストモスでんき 新ベーシックプランのご案内" name="description"/>
<title>新ベーシックプラン｜アストモスでんき</title>
<style>
/* =========================================================
   アストモスでんき 新ベーシックプラン LP
   色・文字サイズ・余白は、まずこの設定一覧から変更できます。
   ========================================================= */
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Meiryo, sans-serif;
  --page-bg: #ffffff; --text: #222222; --muted: #555555; --content-width: 1100px;
  --orange: #eaa527; --orange-dark: #c65d16; --orange-pale: #fff0d9; --orange-light: #fff7ef;
  --border: #f0d8c5; --topbar-bg: #eaa527; --topbar-text: #ffffff;
  --header-bg: #ffffff; --header-height: 76px; --logo-color: #eaa527;
  --hero-start: #eaa527; --hero-middle: #eaa527; --hero-end: #eaa527;
  --hero-title-color: #ffffff; --hero-text-color: #ffffff; --hero-padding-y: 76px;
  --section-padding-y: 70px; --section-heading-color: #eaa527; --section-eyebrow-color: #c65d16;
  --card-bg: #ffffff; --card-border: #f7b97a; --card-radius: 18px;
  --flow-bg: #faf9f6; --flow-icon-color: #eaa527;
  --price-section-bg: #ffffff; --price-table-border: #ead9c2;
  /* 料金表：アストモス列を強調 */
  --price-table-astomos-bg: #fff0d9;
  --price-table-astomos-text: #a84e08;
  --price-table-astomos-heading: #e58b24;
  --price-table-competitor-bg: #ffffff;
  --price-table-competitor-text: #4b5563;
  --price-table-competitor-heading: #667085;
  --price-table-label-bg: #f4f1ec;
  --price-table-note-bg: #fffaf3; --price-table-note-text: #715b2b; --price-table-note-border: #eaa527;
  --button-bg: #eaa527; --button-text: #ffffff; --button-radius: 999px;
  --faq-bg: #fff7ef; --cta-bg-start: #eaa527; --cta-bg-end: #eaa527;
  --footer-bg: #ffffff; --footer-text: #222222;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--page-bg); font-size: 16px; line-height: 1.8; }
a { color: inherit; }
.wrap { width: min(var(--content-width), 92%); margin: 0 auto; }
.topbar { padding: 8px 0; background: var(--topbar-bg); color: var(--topbar-text); font-size: 13px; line-height: 1.6; }
.topbar .wrap { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; }
.header { background: var(--header-bg); border-bottom: 1px solid var(--border); }
.header-inner { min-height: var(--header-height); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.brand { display:flex; align-items:center; flex:0 1 auto; min-width:0; text-decoration:none; line-height:1; }
.brand-logo { display:block; width:268px; max-width:100%; height:auto; object-fit:contain; }
.brand small { display:none; }
.nav { display: flex; align-items: center; gap: 20px; font-size: 13px; }
.nav a { text-decoration: none; color: #555; }
.nav .nav-cta { padding: 9px 15px; color: #fff; background: var(--button-bg); border-radius: var(--button-radius); font-weight: 700; }
.hero { position: relative; overflow: hidden; background: linear-gradient(120deg,var(--hero-start),var(--hero-middle) 52%,var(--hero-end)); }
.hero:after { content: ""; position: absolute; width: 390px; height: 390px; border-radius: 50%; background: rgba(255,255,255,.35); right: -110px; top: -130px; }
.hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr .8fr; gap: 40px; align-items: center; padding: var(--hero-padding-y) 0; }
.pill { display: inline-block; padding: 5px 13px; border: 1px solid var(--orange); border-radius: 999px; background: #fff; color: var(--orange); font-size: 12px; font-weight: 700; }
.eyebrow { color: var(--section-eyebrow-color); font-size: 13px; font-weight: 800; letter-spacing: .13em; }
.hero .eyebrow { margin-top: 18px; color: #c65d16; }
.hero h1 { margin: 14px 0 20px; color: var(--hero-title-color); font-size: clamp(34px,5vw,54px); font-weight: 800; line-height: 1.28; letter-spacing: .02em; }
.hero-copy { max-width: 620px; margin: 0 0 25px; color: var(--hero-text-color); }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 23px; border-radius: var(--button-radius); font-size: 14px; font-weight: 800; text-decoration: none; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #fff; color: var(--orange); border: 1px solid var(--orange); box-shadow: 0 7px 16px rgba(232,117,34,.16); }
.btn-secondary { background: #ffffff; color: var(--orange); border: 1px solid var(--orange); }
.hero-card { padding: 28px; border: 1px solid rgba(255,255,255,.9); border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 16px 45px rgba(16,47,80,.08); }
.hero-card .symbol { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 15px; border-radius: 16px; background: #fff0df; color: var(--orange-dark); font-size: 28px; }
.hero-card h2 { margin: 0 0 8px; color: var(--orange); font-size: 21px; line-height: 1.4; }
.hero-card p { margin: 0; color: var(--muted); font-size: 14px; }
section { padding: var(--section-padding-y) 0; }
.section-head { max-width: 700px; margin: 0 auto 34px; text-align: center; }
.section-head .eyebrow { margin-bottom: 8px; }
.section-head h2 { margin: 0 0 12px; color: var(--section-heading-color); font-size: clamp(26px,3.4vw,36px); font-weight: 800; line-height: 1.4; }
.section-head p { margin: 0; color: var(--muted); }
#features { background: #fff; }
.features { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; }
.feature { padding: 25px; border: 1px solid var(--card-border); border-radius: var(--card-radius); background: var(--card-bg); }
.feature .num { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 16px; border-radius: 13px; background: #fff7ed; color: var(--orange-dark); font-size: 16px; font-weight: 900; }
.feature h3 { margin: 0 0 8px; color: var(--orange); font-size: 18px; line-height: 1.5; }
.feature p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
#flow { padding: 34px 0 40px; background: var(--flow-bg); }
#flow .section-head { max-width: 100%; margin-bottom: 30px; }
#flow .section-head h2 { display: inline-block; margin: 0; padding-bottom: 5px; border-bottom: 2px dotted var(--orange); color: var(--orange); font-size: clamp(25px,3vw,34px); }
#flow .section-head .eyebrow, #flow .section-head p { display: none; }
.flow { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px; align-items: start; }
.flow-item { position: relative; min-width: 0; padding: 0; text-align: center; }
.flow-item:before { content: attr(data-step); display: block; margin-bottom: 12px; color: var(--orange); font-size: 14px; font-weight: 500; }
.flow-icon { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 155px; height: 126px; margin: 0 auto 10px; border-radius: 16px; background: #fff; }
.flow-icon svg { width: 50px; height: 50px; fill: none; stroke: var(--flow-icon-color); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.flow-item p { max-width: 175px; margin: 0 auto; color: #222; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.flow-item:not(:last-child)::after { content: ""; position: absolute; top: 47px; right: -20px; width: 11px; height: 11px; border-top: 4px solid #111; border-right: 4px solid #111; transform: rotate(45deg); }
.disclaimer { margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
#price { background: var(--price-section-bg); }
#price .section-head p { font-size: 16px; }
.price-comparison { width: 100%; max-width: 1000px; margin: 0 auto; }
.price-table-scroll { width: 100%; overflow: hidden; border: 1px solid var(--price-table-border); border-radius: 10px; background: #fff; }
.price-comparison table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; color: #333; font-size: 14px; line-height: 1.5; }
.price-comparison col.category-col { width: 12%; }
.price-comparison col.item-col { width: 23%; }
.price-comparison col.company-col { width: 32.5%; }
.price-comparison th, .price-comparison td { padding: 13px 12px; border-right: 1px solid var(--price-table-border); border-bottom: 1px solid var(--price-table-border); vertical-align: middle; overflow-wrap: anywhere; }
.price-comparison tr > *:last-child { border-right: none; }
.price-comparison tbody tr:last-child > * { border-bottom: none; }
.price-comparison thead th { background: var(--price-table-competitor-heading); color: #fff; font-size: 15px; font-weight: 700; text-align: center; }
.price-comparison thead th:first-child { background: #f4f1ec; color: #4b5563; }
.price-comparison thead th.price-main-heading { background: var(--price-table-astomos-heading); color: #fff; font-weight: 800; }
.price-comparison thead th.price-competitor-heading { background: var(--price-table-competitor-heading); color: #fff; }
.price-comparison .price-category { background: #fff5e8; color: #754b1b; text-align: center; font-weight: 700; }
.price-comparison .price-item { background: #f8f7f5; color: #333; text-align: left; font-weight: 600; }
.price-comparison .price-value { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.price-comparison .price-main { background: var(--price-table-astomos-bg); color: var(--price-table-astomos-text); font-weight: 800; font-size: 1.05em; }
.price-comparison .price-competitor { background: var(--price-table-competitor-bg); color: var(--price-table-competitor-text); font-weight: 500; }
.price-table-notes { margin-top: 18px; padding: 14px 16px; background: var(--price-table-note-bg); border-left: 4px solid var(--price-table-note-border); border-radius: 0 10px 10px 0; color: var(--price-table-note-text); font-size: 12px; line-height: 1.8; }
.price-table-notes p { margin: 0 0 6px; }
.price-table-notes p:last-child { margin-bottom: 0; }
.price-comparison-action { margin-top: 26px; text-align: center; }
#price .price-comparison-action .btn { background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-bg); }
#faq { background: var(--faq-bg); }
.faq { max-width: 850px; margin: 0 auto; }
.faq details { padding: 18px 4px; border-bottom: 1px solid var(--border); }
.faq summary { cursor: pointer; color: #555; font-size: 16px; font-weight: 800; }
.faq details p { margin: 10px 0 0; color: #555; font-size: 14px; line-height: 1.8; }
.cta-band { padding: 58px 20px; background: linear-gradient(115deg,var(--cta-bg-start),var(--cta-bg-end)); text-align: center; }
.cta-band h2 { margin: 0 0 12px; color: #fff; font-size: clamp(25px,3vw,34px); font-weight: 800; line-height: 1.4; }
.cta-band p { max-width: 650px; margin: 0 auto 25px; color: #ffead8; }
.cta-band .btn { background: #fff; color: var(--orange); border: 1px solid #fff; }
.footer { padding: 28px 0; background: var(--footer-bg); color: var(--footer-text); font-size: 12px; }
.footer-inner { display: flex; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }


/* 特定商取引法に基づく表記：参考画像に合わせた表形式 */
#legal-disclosure { padding: 48px 0 12px; background: #f7f7f5; }
#legal-disclosure .section-head { margin-bottom: 22px; }
#legal-disclosure .section-head h2 { display: inline-block; padding-bottom: 5px; border-bottom: 1px dotted var(--orange); }
.legal-panel { padding: 8px; background: #fff; border-radius: 4px; box-shadow: 0 1px 8px rgba(0,0,0,.025); }
.legal-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; line-height: 1.65; }
.legal-table th, .legal-table td { padding: 7px 14px; border-bottom: 1px dotted #eaa527; vertical-align: middle; text-align: left; overflow-wrap: anywhere; }
.legal-table th { width: 175px; color: #fff; background: #eaa527; text-align: center; font-weight: 600; border-radius: 3px; }
.legal-table td { color: #444; }
.legal-table strong { color: #222; }
.legal-table a { color: inherit; text-decoration: underline; }
@media (max-width: 600px) {
  #legal-disclosure { padding: 38px 0 8px; }
  .legal-panel { padding: 7px; }
  .legal-table, .legal-table tbody, .legal-table tr, .legal-table th, .legal-table td { display: block; width: 100%; }
  .legal-table tr { margin-bottom: 10px; border-bottom: 1px dotted #eaa527; }
  .legal-table th { padding: 7px 10px; border-radius: 3px; }
  .legal-table td { padding: 8px 10px; border-bottom: 0; font-size: 13px; }
}

/* タブレット */
@media (max-width: 900px) {
  .nav { gap: 12px; }
  .nav a:not(.nav-cta) { display: none; }
  .hero-inner { gap: 24px; }
  .features { gap: 12px; }
  .feature { padding: 20px; }
  .flow { grid-template-columns: repeat(3,minmax(0,1fr)); row-gap: 30px; column-gap: 18px; }
  .flow-item:not(:last-child)::after { display: none; }
}

/* スマートフォン：手順は横にスワイプ、料金表は縦型カードに変換 */
@media (max-width: 600px) {
  body { font-size: 15px; }
  .wrap { width: 92%; }
  .topbar { font-size: 11px; }
  .topbar .wrap { gap: 2px 8px; }
  .topbar .wrap span:last-child { display: none; }
  .header-inner { min-height: 66px; gap: 8px; }
  .brand-logo { width:clamp(130px,36vw,210px); }
  .nav .nav-cta { padding: 9px 11px; font-size: 11px; white-space: nowrap; }
  .hero-inner { grid-template-columns: 1fr; padding: 48px 0; gap: 26px; }
  .hero h1 { font-size: clamp(32px,9vw,42px); }
  .hero-copy { font-size: 14px; }
  .hero-card { max-width: 480px; padding: 22px; border-radius: 18px; }
  .btn-row { flex-direction: column; align-items: stretch; }
  .btn-row .btn { width: 100%; }
  section { padding: 48px 0; }
  .section-head { margin-bottom: 25px; }
  .section-head h2 { font-size: 26px; }
  .section-head p { font-size: 14px; }
  .features { grid-template-columns: 1fr; gap: 12px; }
  .feature { padding: 20px; }
  #flow { padding: 36px 0; }
  #flow .section-head { margin-bottom: 24px; }
  #flow .section-head h2 { font-size: 23px; }
  /* 横並びの手順：スクロールバーを出さず、右へスワイプ */
  #flow .flow { display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; padding: 2px 2px 12px; margin: 0 -1px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  #flow .flow-item { flex: 0 0 72%; max-width: 250px; scroll-snap-align: start; }
  #flow .flow-item:before { font-size: 13px; margin-bottom: 8px; }
  #flow .flow-icon { height: 110px; max-width: 100%; margin-bottom: 10px; border-radius: 14px; }
  #flow .flow-icon svg { width: 43px; height: 43px; }
  #flow .flow-item p { max-width: 100%; font-size: 13px; }
  #flow .flow-item:not(:last-child)::after { display: block; top: 47px; right: -9px; width: 8px; height: 8px; border-width: 3px; }
  #flow .disclaimer { font-size: 11px; }
  #price { padding: 44px 0; }
  #price .section-head { margin-bottom: 24px; }
  #price .section-head h2 { font-size: 27px; }
  #price .section-head p { font-size: 14px; }
  .price-table-scroll { overflow: visible; border: none; border-radius: 0; background: transparent; }
  .price-comparison table { display: block; width: 100%; min-width: 0; font-size: 13px; }
  .price-comparison colgroup, .price-comparison thead { display: none; }
  .price-comparison tbody { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; }

  .price-comparison tbody tr > * { min-width: 0; border: none; }
  /* rowspanの料金区分セルはスマホでは非表示。項目名に内容を表示 */
  .price-comparison tbody td.price-category { display: none; }
  .price-comparison tbody td.price-item { grid-column: 1 / -1; padding: 11px 13px; background: var(--price-table-label-bg); border-bottom: 1px solid #e7e2dc; font-size: 13px; font-weight: 800; }
  .price-comparison tbody td.price-value { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 78px; padding: 11px 5px; text-align: center; white-space: normal; }
  .price-comparison tbody td.price-value::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .price-comparison tbody td.price-main { background: var(--price-table-astomos-bg); color: var(--price-table-astomos-text); font-size: 15px; font-weight: 800; border-right: 1px solid #f0d8c5; }
  .price-comparison tbody td.price-main::before { color: var(--price-table-astomos-text); }
  .price-comparison tbody td.price-competitor { background: var(--price-table-competitor-bg); color: var(--price-table-competitor-text); font-size: 14px; font-weight: 600; }
  .price-comparison tbody td.price-competitor::before { color: var(--price-table-competitor-text); }
  .price-table-notes { margin-top: 14px; padding: 12px; font-size: 11px; line-height: 1.8; }
  .price-comparison-action { margin-top: 22px; }
  .price-comparison-action .btn { display: flex; width: 100%; max-width: 360px; margin: 0 auto; padding: 14px 12px; line-height: 1.6; }
  #faq { padding: 48px 0; }
  .faq summary { font-size: 14px; }
  .faq details p { font-size: 13px; }
  .cta-band { padding: 44px 0; }
  .cta-band h2 { font-size: 25px; }
  .cta-band p { font-size: 14px; }
  .cta-band .btn { width: 100%; max-width: 360px; }
  .footer-inner { flex-direction: column; gap: 6px; }
}

/* 2026-10-02 追加調整：申込ボタンを申込フロー内へ、スマホ表示を一画面風に整理 */
.flow-apply-action { margin: 24px auto 0; text-align: center; }
.flow-apply-action .btn { min-width: 240px; background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-bg); }
@media (max-width: 600px) {
  /* 特徴はカードを簡素化し、3つの要点を箇条書き風に */
  #features .features { display: block; }
  #features .feature { display: grid; grid-template-columns: 28px minmax(0,1fr); column-gap: 9px; align-items: start; padding: 12px 2px; border: 0; border-bottom: 1px solid #f0d8c5; border-radius: 0; background: transparent; }
  #features .feature:last-child { border-bottom: 0; }
  #features .feature .num { display: flex; width: 25px; height: 25px; margin: 2px 0 0; border-radius: 50%; font-size: 12px; }
  #features .feature h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.45; }
  #features .feature p { grid-column: 2; font-size: 12px; line-height: 1.55; }
  #features .feature p::first-line { }
  /* お申込みの流れ：横スクロールなしで5ステップを一まとまりに */
  #flow { padding: 28px 0 30px; }
  #flow .section-head { margin-bottom: 16px; }
  #flow .section-head h2 { font-size: 21px; }
  #flow .flow { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px 8px; padding: 0; margin: 0; overflow: visible; }
  #flow .flow-item { grid-column: span 2; min-width: 0; max-width: none; padding: 9px 5px 8px; border: 1px solid #eee2d3; border-radius: 10px; background: #fff; }
  #flow .flow-item:nth-child(4) { grid-column: 2 / span 2; }
  #flow .flow-item:nth-child(5) { grid-column: 4 / span 2; }
  #flow .flow-item:before { font-size: 10px; margin-bottom: 5px; font-weight: 800; }
  #flow .flow-icon { height: 48px; width: 48px; max-width: 100%; margin: 0 auto 6px; border-radius: 50%; background: #fff7ef; }
  #flow .flow-icon svg { width: 27px; height: 27px; }
  #flow .flow-item p { font-size: 10px; line-height: 1.45; overflow-wrap: anywhere; }
  #flow .flow-item:not(:last-child)::after { display: none; }
  #flow .disclaimer { margin-top: 10px; font-size: 10px; }
  .flow-apply-action { margin-top: 16px; }
  .flow-apply-action .btn { width: min(100%, 280px); min-width: 0; padding: 11px 14px; font-size: 13px; }
  /* 備考・注記は補助情報として小さめに */
  .price-table-notes { font-size: 10px !important; line-height: 1.55 !important; padding: 9px 10px !important; }
}


/* エリア切替・追加セクション（元HTMLの色・書体を継承） */
.area-control{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.area-current{font-size:13px;font-weight:800;color:var(--orange-dark)}
.area-switch{border:1px solid var(--orange);background:#fff;color:var(--orange-dark);border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.area-picker{border:1px solid var(--border);border-radius:18px;padding:26px;width:min(560px,92vw);max-height:85vh;box-shadow:0 20px 70px #0003}.area-picker::backdrop{background:#0007}.area-picker h2{color:var(--orange);margin:0 0 10px}.area-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}.area-options button{padding:12px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font:inherit;font-weight:700}.area-options button[aria-current=true]{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-dark)}.area-picker-close{float:right;border:0;background:transparent;font-size:26px;cursor:pointer}
.area-options button:disabled{color:#a5a5a5;background:#fafafa;border-color:#e0d8d0;cursor:not-allowed;opacity:.72}.area-options button:disabled:hover{transform:none}.area-notice{font-size:13px;color:var(--muted);margin:13px 0 0}.price-pending{color:#7a5a36;font-size:13px;font-weight:600}.price-comparison .price-value{white-space:normal}
.extra-section{background:var(--flow-bg)}.extra-section:nth-of-type(even){background:#fff}.extra-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.extra-card{padding:23px;border:1px solid var(--card-border);border-radius:var(--card-radius);background:#fff}.extra-card h3{margin:0 0 8px;color:var(--orange);font-size:18px}.extra-card p{margin:0;color:var(--muted);font-size:14px}.campaign-highlight{font-size:clamp(27px,4vw,42px);font-weight:800;color:var(--orange-dark);text-align:center}.extra-center{text-align:center}.extra-center p{max-width:740px;margin:10px auto;color:var(--muted)}
@media(max-width:700px){.area-control{gap:5px}.area-current{font-size:11px}.area-switch{padding:5px 8px;font-size:11px}.header-inner{flex-wrap:wrap;padding:8px 0}.extra-grid{grid-template-columns:1fr}.area-options{gap:7px}.area-options button{padding:9px 4px;font-size:13px}}

/* エリア選択：ポップアップではなくヘッダー直下の横長バー */
.area-bar[hidden]{display:none!important}
.area-bar{background:#fffaf5;border-bottom:1px solid #e9dfd5;box-shadow:0 6px 14px rgba(0,0,0,.04);position:relative;z-index:5}
.area-bar-inner{display:flex;align-items:center;gap:20px;padding:18px 0}
.area-bar-title{font-size:14px;line-height:1.5;font-weight:800;flex:0 0 100px}
.area-bar .area-options{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:8px;margin:0}
.area-bar .area-options button{flex:1 0 69px;min-width:64px;padding:12px 6px;border:1px solid #ded4c9;border-radius:10px;background:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.area-bar .area-options button[aria-current="true"]{background:#eaa527;border-color:#eaa527;color:#fff}
.area-bar .area-options button:disabled{background:#eee;color:#aaa;border-color:#eee;cursor:not-allowed}
.area-bar-note{flex:0 0 220px;font-size:11px;line-height:1.65;margin:0;padding-left:15px;border-left:2px solid #eaa527;color:#555}

.area-bar-inner{display:block;padding:13px 0 11px}

.area-bar .area-options button{display:block;flex:none;min-width:0;width:100%;padding:13px 3px 11px;border:0!important;border-radius:0!important;background:transparent!important;color:#555;font-size:14px;font-weight:700;line-height:1.35;box-shadow:none!important;position:relative;cursor:pointer}
.area-bar .area-options button:not(:disabled):hover{color:#c65d16;background:#fff1dd!important}

.area-bar .area-options button[aria-current="true"]::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:3px;border-radius:3px;background:#eaa527}
.area-bar .area-options button:disabled{color:#b6b6b6!important;background:transparent!important;opacity:1;cursor:not-allowed}
.area-bar-note{margin:8px 0 0;padding:0;border:0;max-width:none;font-size:11px;line-height:1.5;color:#777;text-align:center}
.area-bar-note br{display:none}

/* =========================================================
   色設定（色を変更するときは、まずこのブロックだけ編集してください）
   --bg             ページ全体の背景色（指定画像の色：#EAA527）
   --main           メインカラー（ボタン・選択中エリア・アクセント）
   --dark           メインカラーの濃い色（ボタンの影・文字）
   --soft           薄いアクセント背景
   --surface        カードなどの基本背景
   --surface-soft   見出し・入力欄などの薄い背景
   --ink            基本文字色 / --muted 補足文字色
   --line           枠線色
   --chart-current  現在の電力会社のグラフ線色
   --chart-astomos  アストモスでんきのグラフ線色
   ========================================================= */
:root {
  --bg: #EAA527;
  --main: #f58220;
  --dark: #c95f0b;
  --soft: #fff0df;
  --surface: #ffffff;
  --surface-soft: #fffaf5;
  --input-bg: #fff8f0;
  --focus: #f5c49d;
  --ink: #303030;
  --muted: #666b70;
  --line: #f0d8c2;
  --good: #187647;
  --bad: #b42318;
  --chart-current: #4b91c8;
  --chart-astomos: #f58220;
  --map-hover: #ffe0c6;
  --apply-button-bg: #e15f56; /* 「この内容で申し込む」ボタンの背景色 */
  --apply-button-shadow: #c95f0b; /* 申込ボタンの影の色 */
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,sans-serif;line-height:1.65}
.header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.in,.shell{width:min(1000px,calc(100% - 28px));margin:auto}
.logo{font-size:22px;font-weight:900}.logo span{color:var(--main)}
/* シミュレーションページのタイトル帯を申込ページと同じトンマナに統一 */
.sim-hero{
  width:min(1000px,calc(100% - 28px));
  margin:28px auto 0;
  padding:28px 32px 25px;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 7px 25px #0000000d;
  position:relative;
  overflow:hidden;
}
.sim-hero::before{
  content:&quot;&quot;;
  position:absolute;
  left:0;
  top:26px;
  width:5px;
  height:38px;
  border-radius:0 4px 4px 0;
  background:var(--main);
}
.sim-hero h1{margin:0 0 4px;font-size:clamp(25px,5vw,34px);line-height:1.45;color:#20242a}
.sim-hero p{margin:0;color:var(--muted);font-size:14px}
.shell{margin-top:18px;margin-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 25px #0000000d;margin-bottom:22px;overflow:hidden}
.head{padding:23px 28px 17px;border-bottom:1px solid var(--line)}.step{color:var(--main);font-weight:900;font-size:13px}.head h2{margin:2px 0;font-size:22px}.head p{margin:0;color:var(--muted);font-size:13px}.body{padding:25px 28px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.choices.two{grid-template-columns:1fr 1fr}.choice{min-height:60px;padding:12px;border:2px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-weight:800;cursor:pointer}
.choice:hover,.choice.hovered,.choice.selected{border-color:var(--main);background:var(--soft);color:var(--main)}.choice.selected{background:var(--main);color:#fff}
.method{text-align:left;padding:18px}.method strong,.method span{display:block}.method span{font-size:13px;color:var(--muted);font-weight:400}.method.selected span{color:#fff}
.input{display:none;margin-top:20px;padding:18px;background:#fafafa;border:1px solid var(--line);border-radius:9px}.input.show{display:block}
.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.field label{font-weight:800}.field select,.field input{height:47px;border:1px solid #bbb;border-radius:7px;padding:0 12px;font-size:16px;background:#fff}.field input{width:150px;text-align:right}
.amp-note{display:none;color:var(--muted);font-size:13px;padding:10px 12px;background:#f3f3f3;border-radius:7px}.amp-note.show{display:inline-block}
.actions{text-align:center;padding:0 28px 27px}.btn{min-height:54px;min-width:260px;border:0;border-radius:27px;background:var(--main);color:#fff;font-weight:900;font-size:16px;padding:12px 28px;box-shadow:0 4px 0 var(--dark);cursor:pointer}.btn:disabled{background:#bbb;box-shadow:none;cursor:not-allowed}.btn.secondary{background:#fff;color:var(--main);border:2px solid var(--main);box-shadow:none}
.error{display:none;margin:0 28px 20px;padding:11px 14px;background:#fff0f0;color:var(--bad);font-weight:800;border-radius:7px}.loading{display:none;text-align:center;color:var(--main);font-weight:900;padding-bottom:20px}
.result{display:none}.result.show{display:block}.resultTop{background:var(--soft);padding:27px;text-align:center}.resultTop h2{margin:0 0 15px}.prices{display:grid;grid-template-columns:1fr 1fr;gap:13px}.price{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px}.price.new{border:2px solid var(--main)}.price small{display:block;color:var(--muted)}.price strong{font-size:clamp(24px,5vw,35px)}.saving{font-size:21px;font-weight:900;margin-top:15px}.good{color:var(--good)}.bad{color:var(--bad)}
.resultBody{padding:25px 28px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.summary div{padding:11px;background:#fafafa;border:1px solid var(--line);border-radius:8px}.summary small{display:block;color:var(--muted)}
.chart{height:225px;display:flex;align-items:flex-end;gap:6px;border-left:1px solid #aaa;border-bottom:1px solid #aaa;margin:10px 0 35px;padding:10px 6px 0}.group{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative}.bar{width:39%;min-width:6px;border-radius:3px 3px 0 0}.old{background:#9ca4ab}.newbar{background:var(--main)}.month{position:absolute;bottom:-24px;font-size:10px}.legend{text-align:center;font-size:13px}.legend i{display:inline-block;width:11px;height:11px;margin:0 5px 0 14px}
.table{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}th{background:#f1f1f1}th:first-child,td:first-child{text-align:center}.notes{margin-top:18px;padding:13px;background:#fff8e8;border-left:4px solid var(--main);font-size:13px}.notes p{margin:3px 0}
/* 注意事項：Code.gsから渡される文章の改行を画面にも反映 */
#disclaimer{white-space:pre-line;line-height:1.8}
.disclaimer-title{font-weight:900;margin:12px 0 8px;line-height:1.6}

/* 地域選択 */
.region-layout{display:grid;grid-template-columns:360px 1fr;gap:34px;align-items:center}.region-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.region-selected{margin-top:18px;padding:14px 16px;background:#fafafa;border-radius:10px;border:1px solid var(--line);font-weight:800}.region-selected strong{color:var(--main);font-size:20px;margin-left:8px}
.map-wrap{position:relative;min-height:350px;background:linear-gradient(180deg,#fff,#fcfcfc);border-radius:12px}.japan-map{width:100%;height:350px;overflow:visible}

const numVal=v=&gt;{if(v===''||v==null)return 0;const n=Number(String(v).replace(/,/g,'').replace(/円|kWh/gi,'').trim());return Number.isFinite(n)?n:0;};

function calculateSimulation(input){
  if(!input||!String(input.area||'').trim())throw new Error('対象エリアを選択してください。');
  const areas=LOCAL_DATA.Area_Config, standards=LOCAL_DATA.Standard_Usage;
  const ratios={};LOCAL_DATA.Monthly_Ratio.forEach(r=&gt;{const m=Number(r.Month),v=numVal(r.Ratio);if(m&gt;=1&amp;&amp;m&lt;=12&amp;&amp;v&gt;0&amp;&amp;activeVal(r.IsActive))ratios[m]=v;});
  for(let m=1;m&lt;=12;m++)if(!ratios[m])throw new Error('Monthly_Ratioの'+m+'月が未設定です。');
  const area=areas.find(r=&gt;String(r.AreaName).trim()===input.area&amp;&amp;activeVal(r.IsActive));
  if(!area)throw new Error(input.area+'は現在のシミュレーション対象外です。');
  if(!['simple','detail'].includes(String(input.mode)))throw new Error('シミュレーション方法を選択してください。');
  if(input.mode==='simple'&amp;&amp;!HOUSEHOLDS.includes(String(input.household)))throw new Error('世帯人数を選択してください。');
  if(input.mode==='detail'&amp;&amp;AMPERE_AREAS.includes(String(input.area))&amp;&amp;!AMPERES.includes(capVal(input.capacity)))throw new Error('契約容量（アンペア数）を選択してください。');
  let usage,capacity=capVal(area.DetailedCapacity||'30A'),condition;
  if(input.mode==='simple'){
    const row=standards.find(r=&gt;String(r.AreaName).trim()===input.area&amp;&amp;String(r.HouseholdType).trim()===input.household&amp;&amp;activeVal(r.IsActive));
    if(!row)throw new Error(input.area+'・'+input.household+'のStandard_Usageがありません。');
    const annual=numVal(row.AnnualUsageKwh);if(annual&lt;=0)throw new Error('標準年間使用量を設定してください。');
    capacity=capVal(row.Capacity||capacity);const total=Object.values(ratios).reduce((a,b)=&gt;a+b,0);
    usage=Array.from({length:12},(_,i)=&gt;annual*ratios[i+1]/total);
    condition=input.household+'／標準年間使用量 '+Math.round(annual).toLocaleString('ja-JP')+'kWh';
  }else{
    const month=Number(input.baseMonth),base=numVal(input.baseUsageKwh);
    if(month&lt;1||month&gt;12||base&lt;=0)throw new Error('対象月と使用量を入力してください。');
    if(AMPERE_AREAS.includes(input.area)){const selected=capVal(input.capacity);if(!AMPERES.includes(selected))throw new Error('契約容量（アンペア数）を選択してください。');capacity=selected;}
    usage=Array.from({length:12},(_,i)=&gt;base*ratios[i+1]/ratios[month]);
    condition=month+'月 '+Math.round(base).toLocaleString('ja-JP')+'kWhから推計';
  }
  const areaLabel=(input.area==='東京'?'関東':input.area)+'エリア';
  condition=[areaLabel, ...(AMPERE_AREAS.includes(input.area)?[capacity]:[]), condition].join('／');
  const plans=LOCAL_DATA.Plan_Master,rates=LOCAL_DATA.Rate_Master;
  const oldPlan=plans.find(p=&gt;String(p.PlanID)===String(area.LegacyPlanID)&amp;&amp;activeVal(p.IsActive));
  const newPlan=plans.find(p=&gt;String(p.PlanID)===String(area.AstomosPlanID)&amp;&amp;activeVal(p.IsActive));
  if(!oldPlan)throw new Error('比較元のPlan_Masterがありません。PlanID：'+area.LegacyPlanID);
  if(!newPlan)throw new Error('アストモスでんきのPlan_Masterがありません。PlanID：'+area.AstomosPlanID);
  function price(planId,kwh,cap){
    const rows=rates.filter(r=&gt;String(r.PlanID)===String(planId)&amp;&amp;!['燃料費調整額','再エネ賦課金','再生可能エネルギー発電促進賦課金'].includes(String(r.RateType)));
    if(!rows.length)throw new Error('Rate_Masterに単価がありません。PlanID：'+planId);
    const basics=rows.filter(r=&gt;['基本料金','最低料金'].includes(String(r.RateType)));
    const basic=basics.find(r=&gt;capVal(r.Capacity)===capVal(cap))||basics.find(r=&gt;!capVal(r.Capacity));let total=basic?numVal(basic.UnitPrice):0;
    rows.filter(r=&gt;String(r.RateType)==='電力量料金').sort((a,b)=&gt;numVal(a.MinKwh)-numVal(b.MinKwh)).forEach(r=&gt;{
      const min=numVal(r.MinKwh),raw=r.MaxKwh,max=raw===''||raw==null||numVal(raw)&gt;=99999?Infinity:numVal(raw);
      const qty=max===Infinity?Math.max(0,kwh-min):Math.max(0,Math.min(kwh,max)-min);total+=qty*numVal(r.UnitPrice);
    });return roundVal(total);
  }
  let oldAnnual=0,newAnnual=0;
  const months=usage.map((kwh,i)=&gt;{const old=price(oldPlan.PlanID,kwh,capacity),neo=price(newPlan.PlanID,kwh,capacity);oldAnnual+=old;newAnnual+=neo;return {month:i+1,usageKwh:roundVal(kwh),legacyPrice:old,astomosPrice:neo,saving:roundVal(old-neo)};});
  oldAnnual=roundVal(oldAnnual);newAnnual=roundVal(newAnnual);
  return {area:input.area,displayArea:input.area==='東京'?'関東':input.area,mode:input.mode,condition,capacity,capacityRequired:AMPERE_AREAS.includes(input.area),annualUsageKwh:months.reduce((s,m)=&gt;s+m.usageKwh,0),legacy:{company:area.LegacyCompanyName,plan:oldPlan.PlanName,annualPrice:oldAnnual},astomos:{company:'アストモスでんき',plan:newPlan.PlanName,annualPrice:newAnnual},annualSaving:roundVal(oldAnnual-newAnnual),months,exclusions:'燃料費調整額および再生可能エネルギー発電促進賦課金は計算に含まれていません。',disclaimerTitle:'電気料金シミュレーションのご利用上の注意事項',disclaimer:['※本シミュレーションは、お客様にご入力いただいたデータをもとに独自の計算条件に基づいて算出しております。','※本シミュレーション結果は目安であり、ご利用した時点での電気料金、実際のお支払い額その他を保証するものではありません。','※本シミュレーションの比較元の料金は、ご選択された電力エリアに該当する地域の電力会社の料金単価にて算出しております。なお、料金単価につきましては、各社がウェブサイト等で公開している情報を使用しております。（2026年4月1日時点）','※シミュレーション結果は税込みです。','※地域の電力会社以外との料金比較については、ご自身の請求金額と本シミュレーションの結果を比較してください。','※当社では各地域の電力会社の料金メニュー／サービス等に関するご質問にはお答えできません。各地域の電力会社に直接お問い合わせください。','※各地域の電力会社の最低使用量を下回る使用量を入力された場合は正しく計算できない場合がありますので、ご了承ください。','※電力プランは、以下の条件で試算しております。','北海道電力エリア・東北電力エリア・東京電力エリア・中部電力エリア・北陸電力エリア・九州電力エリア…従量電灯B','関西電力エリア・中国電力エリア・四国電力エリア…従量電灯A'].join('\n'),calculatedAt:new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) };
}

const $=id=&gt;document.getElementById(id);

function displayArea(area){const x=AREA_CONFIG.find(a=&gt;a.internal===area);return x?x.display:area;}
function areaConfig(area){return AREA_CONFIG.find(a=&gt;a.internal===area);}
function isAreaActive(area){const x=areaConfig(area);return !!(x&amp;&amp;x.active);}

function renderAreaConfig(){
  $('areas').innerHTML='';
  AREA_CONFIG.forEach(a=&gt;{
    const b=document.createElement('button');
    b.type='button'; b.className='choice'+(a.active?'':' area-disabled'); b.dataset.area=a.internal;
    b.textContent=a.display; b.disabled=!a.active;
    b.title=a.active?'':'現在のシミュレーション対象外です';
    b.addEventListener('mouseenter',()=&gt;setAreaHover(a.internal,true));
    b.addEventListener('mouseleave',()=&gt;setAreaHover(a.internal,false));
    b.addEventListener('click',()=&gt;{if(a.active)selectArea(a.internal);});
    $('areas').appendChild(b);
  });
  // 4段目は「沖縄｜選択中のエリア（2マス分）」として表示する。
  const selectedPanel=document.createElement('div');
  selectedPanel.className='region-selected region-selected-grid';
  selectedPanel.innerHTML='選択中のエリア：&lt;strong id=&quot;selectedAreaText&quot;&gt;未選択&lt;/strong&gt;';
  $('areas').appendChild(selectedPanel);

  document.querySelectorAll('.map-region').forEach(el=&gt;{
    const area=el.dataset.area;
    const cfg=areaConfig(area);
    const active=!!(cfg&amp;&amp;cfg.active);
    el.classList.toggle('area-disabled',!active);
    el.style.pointerEvents=active?'auto':'none';
    const label=document.querySelector('.map-label[data-label=&quot;'+area+'&quot;]');
    if(label)label.classList.toggle('area-disabled',!active);
    el.onmouseenter=()=&gt;{if(active)setAreaHover(area,true);};
    el.onmouseleave=()=&gt;{if(active)setAreaHover(area,false);};
    el.onclick=()=&gt;{if(active)selectArea(area);};
  });
  const inactive=AREA_CONFIG.filter(a=&gt;!a.active).map(a=&gt;a.display);
  // Area_Configに存在しない沖縄は現状も対象外として案内に含める
  if(!areaConfig('沖縄'))inactive.push('沖縄');
  const unique=[...new Set(inactive)];
  $('mapHelp').textContent=unique.length?'※ '+unique.join('・')+'は現在のシミュレーション対象外です。':'';
}

function loadAreaConfig(){
  AREA_CONFIG=(LOCAL_DATA.Area_Config||[]).filter(r=&gt;String(r.AreaName||'').trim()).map(r=&gt;({internal:String(r.AreaName).trim(),display:String(r.AreaName).trim()==='東京'?'関東':String(r.AreaName).trim(),active:activeVal(r.IsActive)}));
  AMPERE_AREAS=['北海道','東北','東京','中部','北陸','九州'];

function renderAnnualBarComparison(r){
  const current=Number(r.legacy?.annualPrice||0), astomos=Number(r.astomos?.annualPrice||0);
  const saving=Number(r.annualSaving||0);
  const rate=current&gt;0 ? Math.round(Math.abs(saving)/current*1000)/10 : 0;

  const high=Math.max(current,astomos,1);
  const low=Math.min(current,astomos);
  const diff=Math.abs(current-astomos);

  // 上側の拡大表示に使う「きれいな」目盛間隔を決める。
  const rawStep=Math.max(diff/3,high*0.02,1000);
  const pow=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const norm=rawStep/pow;
  const nice=(norm&lt;=1?1:norm&lt;=2?2:norm&lt;=5?5:10)*pow;

  // 0円は必ず表示する。一方、料金比較部分は省略記号より上で拡大する。
  // breakValue～axisMax が上側82%、0円～breakValue は下側18%に圧縮して描画する。
  let breakValue=Math.max(nice,Math.floor((low-nice*1.25)/nice)*nice);
  if(breakValue&lt;=0 || breakValue&gt;=low) breakValue=Math.max(nice,Math.floor(low*0.65/nice)*nice);
  if(breakValue&gt;=low) breakValue=Math.max(nice,low-nice);
  const axisMax=Math.ceil((high+nice*.65)/nice)*nice;
  const upperSpan=Math.max(axisMax-breakValue,1);
  const BREAK_PCT=18;
  const pct=v=&gt;{
    if(v&lt;=0) return 0;
    if(v&lt;=breakValue) return Math.max(2,(v/breakValue)*BREAK_PCT);
    return BREAK_PCT+(v-breakValue)/upperSpan*(100-BREAK_PCT);
  };

  const currentPct=Math.min(100,pct(current));
  const astomosPct=Math.min(100,pct(astomos));
  $('barCurrent').style.height=currentPct+'%';
  $('barAstomos').style.height=astomosPct+'%';
  $('barCurrentValue').textContent=yen(current)+'円';
  $('barAstomosValue').textContent=yen(astomos)+'円';
  $('barCurrentLabel').textContent=r.legacy?.company||'現在のご契約';

  // 各棒にも「～」を入れて、途中の金額帯を省略していることを明示する。
  [$('barCurrent'),$('barAstomos')].forEach(bar=&gt;{
    let mark=bar.querySelector('.bar-break-mark');
    if(!mark){
      mark=document.createElement('span');
      mark.className='bar-break-mark';
      mark.innerHTML='&lt;svg viewBox=&quot;0 0 120 20&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path class=&quot;wave-cut&quot; d=&quot;M0 10 C8 2 16 18 24 10 S40 2 48 10 S64 18 72 10 S88 2 96 10 S112 18 120 10&quot;&gt;&lt;/path&gt;&lt;path class=&quot;wave-edge&quot; d=&quot;M0 10 C8 2 16 18 24 10 S40 2 48 10 S64 18 72 10 S88 2 96 10 S112 18 120 10&quot;&gt;&lt;/path&gt;&lt;/svg&gt;';
      bar.appendChild(mark);
    }
    mark.style.bottom=(BREAK_PCT/currentPct*100)+'%';
  });

  // 縦軸：最下部は必ず0円。省略記号より上だけ比較金額周辺の目盛を表示。
  const yAxis=$('barYAxis');
  const ticks=[];
  for(let v=breakValue;v&lt;=axisMax+nice*.1;v+=nice) ticks.push(v);
  const upperTicks=ticks.map(v=&gt;{
    const bottom=BREAK_PCT+(v-breakValue)/upperSpan*(100-BREAK_PCT);
    return '&lt;div class=&quot;bar-grid-line&quot; style=&quot;bottom:'+bottom+'%&quot;&gt;&lt;span&gt;'+yen(v)+'&lt;/span&gt;&lt;/div&gt;';
  }).join('');
  yAxis.innerHTML=
    '&lt;div class=&quot;bar-grid-line axis-zero&quot; style=&quot;bottom:0%&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;/div&gt;'+upperTicks;

  // 棒の「中心」ではなく、左側の棒の右上端 → 右側の棒の左上端を点線で結ぶ。
  const slopeSvg=$('barSlopeLine');
  const slopeLine=$('barSlopeSegment');
  const area=$('barSlopeLine').parentElement;
  requestAnimationFrame(()=&gt;{
    const ar=area.getBoundingClientRect();
    const c=$('barCurrent').getBoundingClientRect();
    const a=$('barAstomos').getBoundingClientRect();
    const w=Math.max(ar.width,1), h=Math.max(ar.height,1);
    slopeSvg.setAttribute('viewBox','0 0 '+w+' '+h);
    slopeLine.setAttribute('x1',c.right-ar.left);
    slopeLine.setAttribute('y1',c.top-ar.top);
    slopeLine.setAttribute('x2',a.left-ar.left);
    slopeLine.setAttribute('y2',a.top-ar.top);
  });

  // 節約額はグラフの外側にだけ表示する。
  const summary=$('annualSavingSummary');
  if(saving&gt;0){
    summary.innerHTML='&lt;span class=&quot;saving-yen&quot;&gt;年間 '+yen(saving)+'円 節約&lt;/span&gt;';
    $('barComparisonMessage').textContent='現在のご契約からアストモスでんきへ切り替えた場合の年間削減イメージです。';
  }else if(saving&lt;0){
    summary.innerHTML='&lt;span class=&quot;saving-yen&quot;&gt;年間 '+yen(Math.abs(saving))+'円 高い試算&lt;/span&gt;';
    $('barComparisonMessage').textContent='今回の条件では、アストモスでんきの方が年間で約'+rate+'％高い試算です。';
  }else{
    summary.innerHTML='&lt;span class=&quot;saving-yen&quot;&gt;年間差額 0円&lt;/span&gt;';
    $('barComparisonMessage').textContent='今回の条件では、年間の試算額は同額です。';
  }
}

function showResult(r){

    s.className='saving bad';

  renderAnnualBarComparison(r);
}

function drawMonthlyTable(months, legacyCompany){
  const body=$('monthlyTableBody');
  const foot=$('monthlyTableFoot');
  $('tableOldLabel').textContent='現在のご契約';
  if(!months.length){
    body.innerHTML='&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;月別の試算結果を表示できませんでした。&lt;/td&gt;&lt;/tr&gt;';
    foot.innerHTML='';
    return;
  }
  const fmt=v=&gt;Math.round(Number(v)||0).toLocaleString('ja-JP');
  const diffText=v=&gt;Number(v)&lt;0?'▲'+fmt(Math.abs(v)):fmt(v);
  body.innerHTML=months.map(m=&gt;{
    const diff=(Number(m.astomosPrice)||0)-(Number(m.legacyPrice)||0);
    return `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${m.month}月&lt;/th&gt;&lt;td&gt;${fmt(m.usageKwh)}&lt;/td&gt;&lt;td&gt;${fmt(m.legacyPrice)}&lt;/td&gt;&lt;td&gt;${fmt(m.astomosPrice)}&lt;/td&gt;&lt;td&gt;${diffText(diff)}&lt;/td&gt;&lt;/tr&gt;`;
  }).join('');
  const totalUsage=months.reduce((sum,m)=&gt;sum+(Number(m.usageKwh)||0),0);
  const totalLegacy=months.reduce((sum,m)=&gt;sum+(Number(m.legacyPrice)||0),0);
  const totalAstomos=months.reduce((sum,m)=&gt;sum+(Number(m.astomosPrice)||0),0);
  const totalDiff=totalAstomos-totalLegacy;
  foot.innerHTML=`&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;合計&lt;/th&gt;&lt;td&gt;${fmt(totalUsage)}&lt;/td&gt;&lt;td&gt;${fmt(totalLegacy)}&lt;/td&gt;&lt;td&gt;${fmt(totalAstomos)}&lt;/td&gt;&lt;td&gt;${diffText(totalDiff)}&lt;/td&gt;&lt;/tr&gt;`;
}

function getAnalyticsVisitorId(){
  const key='astomos_analytics_visitor_id_v1';
  try {
    let id=localStorage.getItem(key);
    if(!id){
      id=(window.crypto &amp;&amp; typeof window.crypto.randomUUID==='function')
        ? window.crypto.randomUUID()
        : 'v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
      localStorage.setItem(key,id);
    }
    return id;
  } catch(e) {
    // localStorageが使えない場合は訪問ごとのIDとなり、ユニーク数の精度が下がります
    return 'session-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  }
}

  const FAQS=[{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;電気料金シミュレーションでは何が分かりますか？&quot;,&quot;a&quot;:&quot;入力いただいた条件から、現在のご契約を想定した年間電気料金とアストモスでんきの年間電気料金を試算し、年間の差額を表示します。結果はあくまで目安です。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;現在シミュレーションできる地域はどこですか？&quot;,&quot;a&quot;:&quot;現在、このページでは東北エリアをシミュレーション対象としています。対象外の地域は選択できない表示になっています。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;関東など他の地域を選べないのはなぜですか？&quot;,&quot;a&quot;:&quot;現在の公開対象外としているためです。対象地域を追加する場合は、料金設定などの準備後に選択できるようになります。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;かんたんシミュレーションと詳細シミュレーションの違いは何ですか？&quot;,&quot;a&quot;:&quot;かんたんシミュレーションは世帯人数などの標準条件から年間使用量を推計します。詳細シミュレーションは、1か月分の実際の使用量などをもとに年間の使用量を推計します。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;かんたんシミュレーションの使用量はどのように決まりますか？&quot;,&quot;a&quot;:&quot;選択した世帯人数に対応する標準使用量を使って年間使用量を試算します。実際の使用量とは異なる場合があります。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;詳細シミュレーションの年間使用量はどう計算しますか？&quot;,&quot;a&quot;:&quot;入力した対象月の使用量を基準に、コード内に設定した月別使用量比率を使って他の月の使用量を推計します。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;シミュレーション後に条件を変更できますか？&quot;,&quot;a&quot;:&quot;はい。STEP1またはSTEP2の「変更する」ボタンから条件を変更し、再度「シミュレーションする」を押してください。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;月ごとの試算結果も確認できますか？&quot;,&quot;a&quot;:&quot;はい。「月別シミュレーション結果」の「表示する」を押すと、各月の使用量・料金・差額を確認できます。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;年間料金比較の棒グラフは何を表していますか？&quot;,&quot;a&quot;:&quot;左側が現在のご契約を想定した年間料金、右側がアストモスでんきの年間料金です。2本の差が年間の料金差のイメージです。&quot;},{&quot;category&quot;:&quot;シミュレーション&quot;,&quot;q&quot;:&quot;スマートフォンでも利用できますか？&quot;,&quot;a&quot;:&quot;はい。スマートフォンでも地域選択、条件入力、結果確認、申込画面への移動ができるようにしています。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;使用量は何の単位で入力しますか？&quot;,&quot;a&quot;:&quot;電気の使用量はkWh（キロワットアワー）で入力してください。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;電気の使用量はどこで確認できますか？&quot;,&quot;a&quot;:&quot;現在ご契約中の電力会社の請求書、検針票、会員ページなどでご確認ください。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;詳細シミュレーションでは何月を選べばよいですか？&quot;,&quot;a&quot;:&quot;実際の使用量を確認できる月を選択してください。季節による使用量の差があるため、入力する月によって年間推計結果が変わります。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;契約容量（アンペア）はどこで確認できますか？&quot;,&quot;a&quot;:&quot;現在ご契約中の電力会社の請求書、検針票、契約内容のお知らせ、会員ページなどでご確認ください。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;契約容量の入力は必須ですか？&quot;,&quot;a&quot;:&quot;契約容量を使って基本料金を計算する地域・料金プランでは必要です。画面に表示される項目を選択してください。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;必要な条件を入力していない場合でもシミュレーションできますか？&quot;,&quot;a&quot;:&quot;できません。必要な条件が不足している場合は結果画面へ進まず、入力画面で不足内容を確認できるようにしています。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;使用量に0を入力できますか？&quot;,&quot;a&quot;:&quot;年間料金の試算に必要なため、詳細シミュレーションでは0より大きい使用量を入力してください。&quot;},{&quot;category&quot;:&quot;入力方法&quot;,&quot;q&quot;:&quot;入力した条件を最初からやり直したいです。&quot;,&quot;a&quot;:&quot;STEP1・STEP2の「変更する」から修正できます。ページを再読み込みすると入力状態が初期化される場合があります。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;燃料費調整額はシミュレーションに含まれていますか？&quot;,&quot;a&quot;:&quot;いいえ。現在のシミュレーションでは燃料費調整額を計算に含めていません。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;再生可能エネルギー発電促進賦課金は含まれていますか？&quot;,&quot;a&quot;:&quot;いいえ。現在のシミュレーションでは再生可能エネルギー発電促進賦課金を計算に含めていません。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;シミュレーション結果は税込みですか？&quot;,&quot;a&quot;:&quot;はい。現在の画面上の注意事項では、シミュレーション結果は税込みとして案内しています。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;表示された金額が実際の請求額になりますか？&quot;,&quot;a&quot;:&quot;いいえ。シミュレーション結果は目安です。実際の使用量、燃料費調整額、再エネ賦課金その他の条件により実際の請求額とは異なります。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;東北電力の何の料金プランと比較していますか？&quot;,&quot;a&quot;:&quot;現在の東北エリアの比較元は、コード上で東北電力の従量電灯Bとして設定しています。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;比較に使っている料金単価はいつ時点ですか？&quot;,&quot;a&quot;:&quot;現在のシミュレーション注意事項では、比較元の料金単価は2026年4月1日時点の公開情報を使用する設定です。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;「年間○円節約」とは何ですか？&quot;,&quot;a&quot;:&quot;現在のご契約を想定した年間料金から、アストモスでんきの年間試算額を差し引いた金額です。プラスの場合は年間で安くなる試算です。&quot;},{&quot;category&quot;:&quot;料金・結果&quot;,&quot;q&quot;:&quot;実際の請求額とシミュレーション結果が違うのはなぜですか？&quot;,&quot;a&quot;:&quot;実際の使用量の変動や、シミュレーションに含めていない燃料費調整額・再エネ賦課金などにより差が生じることがあります。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;シミュレーション結果から申し込むにはどうすればよいですか？&quot;,&quot;a&quot;:&quot;結果画面の「お申し込みはこちら」を押すと、同じページ内のWeb申込画面へ進みます。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;シミュレーションをしなくても申し込めますか？&quot;,&quot;a&quot;:&quot;はい。ヘッダーの「お申し込みはこちら」から申込画面へ進めます。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;申込み前に何を準備すればよいですか？&quot;,&quot;a&quot;:&quot;現在の電気契約内容が確認できる請求書、検針票、契約内容のお知らせなどをご用意いただくと入力がスムーズです。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;お客様番号とは何ですか？&quot;,&quot;a&quot;:&quot;現在ご契約中の電力会社がお客様ごとに付与している番号です。請求書や検針票、会員ページなどでご確認ください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;供給地点特定番号とは何ですか？&quot;,&quot;a&quot;:&quot;電気を使用している地点を識別するための番号です。現在ご契約中の電力会社の請求書や会員ページなどでご確認ください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;現在契約中の電力会社名は何を入力すればよいですか？&quot;,&quot;a&quot;:&quot;現在、電気料金をお支払いしている電力会社・小売電気事業者の名称を入力してください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;住所はどこまで入力する必要がありますか？&quot;,&quot;a&quot;:&quot;申込画面で必須表示されている郵便番号、都道府県、市区町村、番地などを入力してください。建物名・部屋番号は画面上の必須・任意表示に従ってください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;マンション・ビル名は必須ですか？&quot;,&quot;a&quot;:&quot;現在の申込画面ではマンション・ビル名は任意項目として表示しています。該当する場合は入力をおすすめします。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;電話番号はなぜ必要ですか？&quot;,&quot;a&quot;:&quot;申込内容の確認などで連絡が必要となる場合に使用します。入力画面の案内に従って正しい番号をご入力ください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;メールアドレスは正しく入力する必要がありますか？&quot;,&quot;a&quot;:&quot;はい。申込受付の控えなどの案内に使用するため、受信可能なメールアドレスを正しく入力してください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;申込内容を送信する前に確認できますか？&quot;,&quot;a&quot;:&quot;はい。申込フローの確認・同意ステップで、入力内容を確認してから送信できる構成です。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;入力内容を修正したい場合はどうすればよいですか？&quot;,&quot;a&quot;:&quot;確認画面の「戻る」などから前のSTEPへ戻り、該当項目を修正してください。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;申込完了後は何が表示されますか？&quot;,&quot;a&quot;:&quot;申込受付完了画面に受付メッセージや受付日時などを表示する構成です。&quot;},{&quot;category&quot;:&quot;お申込み&quot;,&quot;q&quot;:&quot;申込ボタンを何度も押してしまいました。&quot;,&quot;a&quot;:&quot;重複申込が心配な場合は、受付メールや完了画面をご確認ください。不明な場合はQ&amp;Aの未解決案内からお問い合わせください。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;現在の電力会社への解約手続きは必要ですか？&quot;,&quot;a&quot;:&quot;切替方法は現在の契約状況によって異なる場合があります。申込画面の案内に従い、不明な場合はお問い合わせ窓口へご確認ください。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;切替時に停電しますか？&quot;,&quot;a&quot;:&quot;一般的な電力会社の切替では、切替そのものによる停電は通常想定されません。ただし設備工事など個別事情がある場合は異なることがあります。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;スマートメーターへの交換が必要ですか？&quot;,&quot;a&quot;:&quot;設備状況によって交換等が必要となる場合があります。必要な場合は一般送配電事業者側の手続きとなります。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;電気の品質は変わりますか？&quot;,&quot;a&quot;:&quot;小売電気事業者を切り替えても、地域の送配電網を通じて電気が届けられる仕組み自体は変わりません。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;いつからアストモスでんきに切り替わりますか？&quot;,&quot;a&quot;:&quot;申込内容や切替手続きの状況により異なります。具体的な供給開始時期は手続き状況に応じてご案内します。&quot;},{&quot;category&quot;:&quot;切替・手続き&quot;,&quot;q&quot;:&quot;引っ越し先で新しく電気を使いたい場合もこの申込フォームでよいですか？&quot;,&quot;a&quot;:&quot;お申込みの種類や供給開始状況によって必要な手続きが異なる場合があります。画面の案内で判断できない場合はお問い合わせ窓口へご確認ください。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;「シミュレーションする」を押しても結果が表示されません。&quot;,&quot;a&quot;:&quot;STEP1・STEP2の必須条件がすべて選択・入力されているか確認してください。エラー表示がある場合はその内容を修正してから再度お試しください。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;申込画面からシミュレーション画面へ戻りたいです。&quot;,&quot;a&quot;:&quot;ヘッダー右上の「料金シミュレーションはこちら」を押してください。スマートフォンでも表示されるようにしています。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;画面が正しく表示されません。&quot;,&quot;a&quot;:&quot;ページを再読み込みし、最新のChrome、Edge、Safariなど一般的なブラウザで再度お試しください。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;スマートフォンでボタンが見つかりません。&quot;,&quot;a&quot;:&quot;ページ上部のヘッダーと各STEP下部をご確認ください。申込画面では右上にシミュレーションへ戻るボタンを表示します。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;入力途中でページを閉じた場合、内容は保存されますか？&quot;,&quot;a&quot;:&quot;入力内容の自動保存は保証していません。ページを閉じたり再読み込みした場合は、再入力が必要になることがあります。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;申込受付メールが届きません。&quot;,&quot;a&quot;:&quot;迷惑メールフォルダや入力したメールアドレスをご確認ください。しばらくしても確認できない場合はお問い合わせ窓口へご確認ください。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;Q&amp;Aに知りたい質問がありません。&quot;,&quot;a&quot;:&quot;近い内容の質問を選んでも解決しない場合は、回答下部の「解決していない」を押してください。お問い合わせ窓口をご案内します。&quot;},{&quot;category&quot;:&quot;トラブル・その他&quot;,&quot;q&quot;:&quot;Q&amp;Aで解決しなかった場合はどうすればよいですか？&quot;,&quot;a&quot;:&quot;各回答の下にある「解決していない」を押してください。コールセンターの設定済み連絡先、またはお問い合わせフォームをご案内します。&quot;}];
  /* コールセンター情報はここだけ設定してください。元コードに電話番号がないため、架空の番号は入れていません。 */
  const QA_CONTACT={
    name:'アストモスでんき コールセンター',
    phone:'',       // 例：0120-000-000
    tel:'',         // ハイフンなし。例：0120000000
    hours:'',       // 例：平日 9:00～17:00
    formUrl:'https://www.astomos.jp/form/'
  };
  const $=id=&gt;document.getElementById(id);
  const catalogView=$('qaCatalogView'), answerView=$('qaAnswerView'), after=$('qaAfterFeedback');
  let selected=null;
  function setOpen(open){
    $('qaPanel').hidden=!open;
    $('qaLaunch').setAttribute('aria-expanded',String(open));
  }
  function renderCatalog(){
    const root=$('qaCatalog');root.innerHTML='';
    const groups=[...new Set(FAQS.map(x=&gt;x.category))];
    groups.forEach((cat,index)=&gt;{
      const d=document.createElement('details');d.className='qa-category';if(index===0)d.open=true;
      const s=document.createElement('summary');s.textContent=cat;d.appendChild(s);
      FAQS.filter(x=&gt;x.category===cat).forEach(item=&gt;{
        const b=document.createElement('button');b.type='button';b.className='qa-question';b.textContent=item.q;
        b.onclick=()=&gt;showAnswer(item);d.appendChild(b);
      });
      root.appendChild(d);
    });
  }
  function resetFeedback(){
    after.innerHTML='';$('qaSolved').disabled=false;$('qaUnsolved').disabled=false;$('qaFeedbackArea').style.display='block';
  }
  function showAnswer(item){
    selected=item;resetFeedback();
    $('qaSelectedQuestion').textContent=item.q;$('qaAnswer').textContent=item.a;
    catalogView.style.display='none';answerView.classList.add('show');
    document.querySelector('.qa-main').scrollTop=0;
  }
  function backToCatalog(){answerView.classList.remove('show');catalogView.style.display='block';selected=null;document.querySelector('.qa-main').scrollTop=0;}
  function disableFeedback(){$('qaSolved').disabled=true;$('qaUnsolved').disabled=true;}
  function solved(){
    disableFeedback();
    after.innerHTML='&lt;div class=&quot;qa-result-note&quot;&gt;解決したと回答いただきありがとうございます。ほかのご質問がある場合は「質問一覧に戻る」から続けて確認できます。&lt;/div&gt;';
  }
  function unsolved(){
    disableFeedback();
    const card=document.createElement('div');card.className='qa-contact-card';
    const title=document.createElement('strong');title.textContent='お問い合わせ先';card.appendChild(title);
    const name=document.createElement('div');name.textContent=QA_CONTACT.name;card.appendChild(name);
    if(QA_CONTACT.phone &amp;&amp; QA_CONTACT.tel){
      const phone=document.createElement('a');phone.className='qa-contact-phone';phone.href='tel:'+QA_CONTACT.tel;phone.textContent=QA_CONTACT.phone;card.appendChild(phone);
      if(QA_CONTACT.hours){const h=document.createElement('div');h.className='qa-contact-hours';h.textContent='受付時間：'+QA_CONTACT.hours;card.appendChild(h);}
    }else{
      const unset=document.createElement('div');unset.className='qa-contact-unset';unset.textContent='コールセンター電話番号は現在このページに未設定です。';card.appendChild(unset);
    }
    if(QA_CONTACT.formUrl){const link=document.createElement('a');link.className='qa-contact-form';link.href=QA_CONTACT.formUrl;link.target='_blank';link.rel='noopener';link.textContent='お問い合わせフォーム';card.appendChild(link);}
    after.innerHTML='';after.appendChild(card);
  }
  $('qaLaunch').onclick=()=&gt;setOpen($('qaPanel').hidden);$('qaClose').onclick=()=&gt;setOpen(false);$('qaBack').onclick=backToCatalog;$('qaSolved').onclick=solved;$('qaUnsolved').onclick=unsolved;
  $('qaPanel').addEventListener('keydown',e=&gt;{if(e.key==='Escape')setOpen(false);});
  renderCatalog();
})();
&lt;/script&gt;
&lt;style&gt;
/* ブランドトーン統一：参考ページのシンプルな入力フォームに合わせた共通スタイル */

body{background:var(--bg);color:var(--ink);font-family:&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif}
.header{height:68px;background:#fff;border-bottom:3px solid var(--main);box-shadow:0 2px 8px #00000008}
.logo{font-size:22px;letter-spacing:.01em;color:#333}
.logo span{color:var(--main)}
.hero{background:#fff;text-align:left;padding:27px max(18px,calc((100% - 1000px)/2));border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:.01em}
.hero h1:before{content:&quot;&quot;;display:inline-block;width:5px;height:1em;background:var(--main);margin-right:12px;vertical-align:-.12em;border-radius:2px}
.hero p{padding-left:17px;font-size:14px}
.shell{margin-top:24px}
.card{border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 2px 10px #00000008}
.head{background:#fff;padding:20px 26px 16px;border-bottom:1px solid var(--line)}
.step{color:var(--main);font-size:12px;letter-spacing:.08em}
.head h2{font-size:21px;color:#333}
.body,.resultBody{background:#fff}
.choice{border:1px solid #cfd2d5;border-radius:6px;transition:background .15s,border-color .15s,color .15s}
.choice:hover,.choice.hovered{border-color:var(--main);background:var(--soft);color:var(--dark)}
.choice.selected{border-color:var(--main);background:var(--main);color:#fff}
.input{background:#fafafa;border:1px solid #e2e2e2;border-radius:6px}
.field select,.field input,.qa-compose input{border:1px solid #c9cdd1;border-radius:5px}
.field select:focus,.field input:focus,.qa-compose input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--main)}
.btn{background:var(--main);border-radius:7px;box-shadow:0 3px 0 var(--dark);font-weight:800;letter-spacing:.02em}
.btn:hover:not(:disabled),.qa-launch:hover,.qa-compose button:hover{filter:brightness(.96)}
.btn.secondary{border:1px solid var(--main);border-radius:7px;color:var(--dark)}
.resultTop{background:var(--soft);border-bottom:1px solid var(--line)}
.result .price{border-radius:8px;box-shadow:none}
.result .price.new{border:2px solid var(--main);background:var(--surface-soft)}
.result .saving{border-radius:7px}
.chart-section{border-radius:8px;box-shadow:none}
.region-selected{border-radius:6px;background:#fafafa}
.map-wrap{background:#fff;border:1px solid #eee;border-radius:8px}
.map-region:hover,.map-region.hovered{fill:var(--map-hover);stroke:var(--main)}
.map-region.selected{fill:var(--main)}
.qa-launch,.qa-compose button{background:var(--main);border-radius:7px}
.qa-head{background:var(--soft)}
.qa-browse,.qa-catalog summary,.qa-contact{color:var(--dark)}
.qa-feedback button{border-color:var(--main);color:var(--dark);border-radius:6px}
.qa-user{background:var(--soft)}
@media(max-width:630px){
 .header{height:60px}
 .hero{padding:21px 16px}
 .hero h1{font-size:24px}
 .hero p{padding-left:17px}
 .head{padding:18px 16px 14px}
 .btn,.cta-area .btn{border-radius:6px}
}
&lt;/style&gt;

&lt;script id=&quot;post-simulation-condition-js&quot;&gt;
(function(){
  function updatePostSimulationConditions(){
    var areaText=document.getElementById('selectedAreaText');
    var household=document.getElementById('household');
    var postArea=document.getElementById('postAreaText');
    var postHousehold=document.getElementById('postHouseholdText');
    var row=document.getElementById('postHouseholdRow');
    if(postArea) postArea.textContent=(areaText ? areaText.textContent : '');
    if(postHousehold) postHousehold.textContent=(household &amp;&amp; household.value ? household.value : '');
    if(row) row.style.display=(household &amp;&amp; household.value) ? '' : 'none';
    var simArea=document.getElementById('simulationArea');
    if(simArea) simArea.classList.add('post-simulation');
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('#run');
    if(!b) return;
    function applyOnlyAfterSuccess(){
      var result=document.getElementById('result');
      if(result &amp;&amp; result.classList.contains('show')){
        updatePostSimulationConditions();
      }
    }
    setTimeout(applyOnlyAfterSuccess,200);
    setTimeout(applyOnlyAfterSuccess,600);
  },true);
  window.addEventListener('load',function(){
    var result=document.getElementById('result');
    if(result &amp;&amp; getComputedStyle(result).display!=='none') updatePostSimulationConditions();
  });
})();
&lt;/script&gt;

&lt;script id=&quot;condition-edit-and-rerun-controls&quot;&gt;
(function(){
  const simArea=document.getElementById('simulationArea');
  const result=document.getElementById('result');
  const run=document.getElementById('run');
  if(!simArea||!run) return;

  function setRunLabel(){
    run.textContent='シミュレーションする';
  }
  setRunLabel();

  document.addEventListener('click',function(e){
    const edit=e.target.closest('.condition-edit-btn');
    if(!edit) return;
    e.preventDefault();
    const step=edit.dataset.editStep;
    simArea.classList.remove('post-simulation');
    if(result) result.classList.remove('show');
    if(typeof setSimulationInputsDisabled==='function') setSimulationInputsDisabled(false);
    if(typeof hideError==='function') hideError();
    setRunLabel();
    const target=document.getElementById(step==='area'?'areaConditionStep':'methodConditionStep');
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
  });
})();
&lt;/script&gt;

&lt;script id=&quot;simulation-progress-sync-v7&quot;&gt;
(function(){
  const items=[...document.querySelectorAll('#simulationPage .sim-progress-item')];
  const simArea=document.getElementById('simulationArea');
  const result=document.getElementById('result');
  function setProgress(n){
    items.forEach((item,i)=&gt;{
      const step=i+1;
      item.classList.toggle('active',step===n);
      item.classList.toggle('done',step&lt;n);
    });
  }
  setProgress(1);
  document.addEventListener('click',function(e){
    const edit=e.target.closest('.condition-edit-btn');
    if(edit){
      setProgress(edit.dataset.editStep==='area'?1:2);
      return;
    }
    if(e.target.closest('#methodConditionStep .method, #methodConditionStep select, #methodConditionStep input')){
      setProgress(2);
    }
    if(e.target.closest('#areaConditionStep .choice, #areaConditionStep .region-buttons button, #areaConditionStep .map-region, #areaConditionStep .map-label')){
      setProgress(1);
    }
    if(e.target.closest('#run')){
      const check=function(){
        if(result &amp;&amp; result.classList.contains('show')) setProgress(3);
      };
      setTimeout(check,200);
      setTimeout(check,600);
    }
  },true);
  const observer=new MutationObserver(function(){
    if(simArea &amp;&amp; simArea.classList.contains('post-simulation') &amp;&amp; result &amp;&amp; result.classList.contains('show')) setProgress(3);
  });
  if(simArea) observer.observe(simArea,{attributes:true,attributeFilter:['class'],subtree:true});
})();
&lt;/script&gt;
